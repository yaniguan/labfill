name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU PyTorch and package
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Run pytest
        run: pytest
      - name: Smoke-run recipes
        if: matrix.python-version == '3.12'
        run: |
          python recipes/01_batched_validation.py
          python recipes/02_twins_and_repair.py
          python recipes/03_planning_and_scheduling.py
          python recipes/04_fill_one_gpu.py
          python recipes/05_plate_rehearsal.py
