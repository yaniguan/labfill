name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU PyTorch and package
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Run pytest
        run: pytest --ignore=tests/test_lablean_live_parity.py
      - name: Smoke-run recipes
        if: matrix.python-version == '3.12'
        run: |
          python recipes/01_batched_validation.py
          python recipes/02_twins_and_repair.py
          python recipes/03_planning_and_scheduling.py
          python recipes/04_fill_one_gpu.py
          python recipes/05_plate_rehearsal.py

  lablean-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone YLM at pinned commit 55e817b
        run: |
          git clone https://github.com/yaniguan/YLM.git /tmp/YLM
          git -C /tmp/YLM checkout 55e817b
      - name: Install elan and build YLM LabLean + LabFillLean
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          "$HOME/.elan/bin/lake" --dir /tmp/YLM/lean build LabLean.Checker
          "$HOME/.elan/bin/lake" --dir lean build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch and labfill
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Run live YLM LabLean 310-protocol conformance suite
        env:
          LABFILL_LABLEAN_DIR: /tmp/YLM/lean
        run: pytest -p no:cacheprovider -v tests/test_lablean_io.py tests/test_lablean_live_parity.py
