[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labfill"
version = "0.1.0"
description = "Batched tensor recipes for lab protocols, checking, planning, and single-GPU training saturation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Yani Guan" }]
dependencies = [
    "torch>=2.5",  # nested_tensor_from_jagged SDPA and FlexAttention
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["labfill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
